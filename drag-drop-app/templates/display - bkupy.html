<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Machine - Field Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        #display-grid-name {
            font-size: 8vh;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2vh;
            text-align: center;
        }

        #display-flag-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 2vh;
        }

        #display-flag-image {
            max-height: 60vh;
            max-width: 90vw;
            object-fit: contain;
            border: 10px solid #FFFFFF;
            background-color: #FFFFFF;
            display: none;
        }

        #display-class-timer {
            font-size: 25vh;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 2vh;
            font-variant-numeric: tabular-nums;
            color: #00FF00;
        }
    </style>
</head>
<body>

    <div class="display-container">
        <div id="display-grid-name">STANDBY</div>
        
        <div id="display-flag-container">
            <img id="display-flag-image" src="" alt="Active Signal">
        </div>

        <div id="display-class-timer">--</div>
    </div>

    <script>
        const gridNameEl = document.getElementById('display-grid-name');
        const flagImageEl = document.getElementById('display-flag-image');
        const classTimerEl = document.getElementById('display-class-timer');

        setInterval(() => {
            fetch('/api/display-state')
                .then(response => response.json())
                .then(state => {
                    if (state.status === "RUNNING") {
                        gridNameEl.innerText = state.grid_name;

                        // minutes-only for sailors
                        if (state.live_timer && state.live_timer.includes(':')) {
                            classTimerEl.innerText = state.live_timer.split(':')[0];
                        } else {
                            classTimerEl.innerText = state.live_timer || '--';
                        }
                        
                        if (state.flag_image) {
                            flagImageEl.style.display = "block";
                            const newSrc = `/static/flags/${state.flag_image}`;
                            if (!flagImageEl.src.includes(state.flag_image)) {
                                flagImageEl.src = newSrc;
                            }
                        } else {
                            flagImageEl.style.display = "none";
                        }
                    } else {
                        gridNameEl.innerText = "STANDBY";
                        classTimerEl.innerText = "--";
                        flagImageEl.style.display = "none";
                    }
                })
                .catch(error => console.error("Display sync error:", error));
        }, 1000);
    </script>
</body>
</html>

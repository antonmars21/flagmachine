<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Machine - Outdoor Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* 4-CELL GRID LAYOUT */
        .display-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            padding: 40px;
        }

        /* FLAG CELLS */
        .flag-cell {
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .flag-cell img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .flag-cell.empty {
            color: #555;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .flag-cell.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* TIMER CELL */
        .timer-cell {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-size: 30vw;
            font-weight: 900;
            color: #00ff00;
            text-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
            letter-spacing: 20px;
            line-height: 1;
        }

        .timer-cell.hidden {
            display: none;
        }

        /* TOGGLE BUTTON */
        .control-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
        }

        .toggle-btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #666;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background-color: #555;
            border-color: #888;
        }

        .toggle-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="display-container">
        <!-- CELL 1: Primary Flag -->
        <div id="flag-1" class="flag-cell">
            <span class="empty">NO FLAG</span>
        </div>

        <!-- CELL 2: Secondary Flag (if exists) -->
        <div id="flag-2" class="flag-cell hidden">
            <span class="empty">NO FLAG</span>
        </div>

        <!-- CELL 3: Timer (Total Countdown) -->
        <div id="timer-display" class="timer-cell">--</div>
    </div>

    <!-- Toggle Button (hidden, for reference) -->
    <div class="control-bar" style="display: none;">
        <button class="toggle-btn" id="toggle-countdown">🔒 HIDE TIMER</button>
    </div>

    <script>
        const API_ENDPOINT = '/api/display-state';
        const POLL_INTERVAL_MS = 500;

        const flag1El = document.getElementById('flag-1');
        const flag2El = document.getElementById('flag-2');
        const timerEl = document.getElementById('timer-display');

        let lastState = null;
        let currentMode = 'flags';

        // FETCH & UPDATE DISPLAY
        async function fetchDisplayState() {
            try {
                const response = await fetch(API_ENDPOINT);
                const data = await response.json();
                
                console.log('Display state received:', data);

                if (JSON.stringify(data) !== JSON.stringify(lastState)) {
                    updateUI(data);
                    lastState = data;
                }
            } catch (error) {
                console.error("Failed to fetch display state:", error);
            }
        }

        function updateUI(data) {
            console.log('Updating UI with:', data);
            
            currentMode = data.display_mode || 'flags';
            console.log('Display mode:', currentMode);
            
            // UPDATE FLAG 1
            if (currentMode === 'flags' || currentMode === 'both') {
                if (data.flag_image && data.flag_image !== "") {
                    const flagUrl = `/static/flags/${data.flag_image}`;
                    console.log('Loading flag 1:', flagUrl);
                    flag1El.innerHTML = `<img src="${flagUrl}" alt="Flag 1">`;
                    flag1El.classList.remove('hidden');
                } else {
                    flag1El.innerHTML = '<span class="empty">NO FLAG</span>';
                    flag1El.classList.remove('hidden');
                }
            } else {
                flag1El.classList.add('hidden');
            }

            // UPDATE FLAG 2 (if secondary flag exists)
            if ((currentMode === 'flags' || currentMode === 'both') && data.secondary_flag_image && data.secondary_flag_image !== "") {
                const flag2Url = `/static/flags/${data.secondary_flag_image}`;
                console.log('Loading flag 2:', flag2Url);
                flag2El.innerHTML = `<img src="${flag2Url}" alt="Flag 2">`;
                flag2El.classList.remove('hidden');
            } else {
                flag2El.classList.add('hidden');
            }

            // UPDATE TIMER (Total Countdown - whole minutes only)
            if (currentMode === 'both' || currentMode === 'number') {
                const timerValue = data.live_timer;
                console.log('Timer value:', timerValue);
                
                if (timerValue === "0" || timerValue === 0) {
                    timerEl.textContent = "GO";
                } else if (timerValue && timerValue !== "--") {
                    timerEl.textContent = timerValue;
                } else {
                    timerEl.textContent = "--";
                }
                timerEl.classList.remove('hidden');
            } else {
                timerEl.classList.add('hidden');
            }
        }

        // START POLLING
        console.log('Display board started, polling every', POLL_INTERVAL_MS, 'ms');
        setInterval(fetchDisplayState, POLL_INTERVAL_MS);
        fetchDisplayState();
    </script>
</body>
</html>
